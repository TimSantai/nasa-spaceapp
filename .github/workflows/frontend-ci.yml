name: frontend-ci
on:
  push:
    branches: [main]
    paths: ["frontend-nasa/**", "contracts/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend-nasa/**", "contracts/**", ".github/workflows/frontend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nasa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-nasa/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: npm run lint
      - run: npm run build
