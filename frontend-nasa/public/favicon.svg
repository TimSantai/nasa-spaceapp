<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6F7F8" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="favLeaf" x1="18" y1="16" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Die-Cut Border -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <rect x="3.5" y="3.5" width="41" height="41" rx="11.5" fill="url(#favBg)" />

  <!-- Tri-Arc Rotation Arrows -->
  <path d="M14,18 A16,16 0 0,1 32,11" stroke="#237F8E" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="31,8 37,12 31,15" fill="#237F8E" />

  <path d="M38,22 A16,16 0 0,1 29,38" stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="32,40 26,38 30,34" fill="#F59E0B" />

  <path d="M21,38 A16,16 0 0,1 10,24" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="8,27 10,21 14,26" fill="#10B981" />

  <!-- Orbiting Satellite Mini -->
  <g transform="translate(36, 10) rotate(30)">
    <rect x="-6" y="-2" width="4" height="4" rx="0.8" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.6" />
    <rect x="2" y="-2" width="4" height="4" rx="0.8" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.6" />
    <rect x="-2" y="-2.5" width="4" height="5" rx="1" fill="#F59E0B" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Fertile Furrow -->
  <path d="M16,35 C20,32 28,32 32,35 C32,37 28,39 24,39 C20,39 16,37 16,35 Z" fill="#92400E" stroke="#FFFFFF" stroke-width="1" />

  <!-- Seedling Sprout -->
  <path d="M24,33 C20,31 17,25 19,21 C23,21 24,26 24,33 Z" fill="url(#favLeaf)" stroke="#FFFFFF" stroke-width="1" />
  <path d="M24,33 C25,26 28,19 33,20 C34,25 30,30 24,33 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1" />
  <path d="M24,35 L24,29" stroke="#047857" stroke-width="1.8" stroke-linecap="round" />
</svg>
