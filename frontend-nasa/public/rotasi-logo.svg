<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" role="img" aria-label="ROTASI Logo">
  <defs>
    <!-- Sticker Drop Shadow -->
    <filter id="rotasiShadow" x="-10%" y="-10%" width="128%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Background Gradients -->
    <linearGradient id="bgPillGrad" x1="16" y1="12" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F8F5" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Orbit Gradients -->
    <linearGradient id="orbitTeal" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#237F8E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="50" y1="45" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="soilGrad" x1="40" y1="80" x2="80" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="solarGrad" x1="0" y1="0" x2="10" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Group with Die-cut sticker shadow -->
  <g filter="url(#rotasiShadow)">
    <!-- Die-Cut White Border Shell (Sticker Contour) -->
    <rect x="8" y="8" width="104" height="104" rx="32" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
    
    <!-- Inner Radiant Disc -->
    <rect x="12" y="12" width="96" height="96" rx="28" fill="url(#bgPillGrad)" />

    <!-- 3-Season Rotation Orbital Flow (Tri-arc cycle) -->
    <!-- Arc 1: Monsoon Paddy / Teal -->
    <path
      d="M34,42 A38,38 0 0,1 78,26"
      stroke="#237F8E"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-dasharray="1 0"
    />
    <!-- Arrowhead Arc 1 -->
    <polygon points="76,21 86,27 75,32" fill="#237F8E" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Arc 2: Palawija 1 / Amber Gold -->
    <path
      d="M94,54 A38,38 0 0,1 74,96"
      stroke="#F59E0B"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <!-- Arrowhead Arc 2 -->
    <polygon points="78,100 68,96 74,89" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Arc 3: Palawija 2 / Emerald Green -->
    <path
      d="M52,97 A38,38 0 0,1 24,62"
      stroke="#10B981"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <!-- Arrowhead Arc 3 -->
    <polygon points="20,68 24,56 30,65" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- NASA Satellite Telemetry Scan Rays (Down to Center Farm) -->
    <path
      d="M88,24 L64,62 M88,24 L56,66 M88,24 L72,66"
      stroke="#0284C7"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-dasharray="2 3"
      opacity="0.55"
    />

    <!-- Spaceborne Agro-Satellite (Top-Right Orbit) -->
    <g transform="translate(86, 22) rotate(28)">
      <!-- Left Solar Wing -->
      <rect x="-14" y="-4" width="9" height="8" rx="1.5" fill="url(#solarGrad)" stroke="#FFFFFF" stroke-width="1.2" />
      <line x1="-9.5" y1="-4" x2="-9.5" y2="4" stroke="#93C5FD" stroke-width="0.8" />
      
      <!-- Right Solar Wing -->
      <rect x="5" y="-4" width="9" height="8" rx="1.5" fill="url(#solarGrad)" stroke="#FFFFFF" stroke-width="1.2" />
      <line x1="9.5" y1="-4" x2="9.5" y2="4" stroke="#93C5FD" stroke-width="0.8" />

      <!-- Center Satellite Chassis -->
      <rect x="-4.5" y="-5" width="9" height="10" rx="2" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.4" />
      <!-- Sensor Lens / Gold Foil Accent -->
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="1.2" fill="#0284C7" />
      
      <!-- Antenna Rod -->
      <line x1="0" y1="-5" x2="0" y2="-9" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="0" cy="-9.5" r="1" fill="#EF4444" />
    </g>

    <!-- Center Ground: Fertile Soil Furrow Mound -->
    <path
      d="M40,84 C48,78 72,78 80,84 C82,88 78,92 60,93 C42,92 38,88 40,84 Z"
      fill="url(#soilGrad)"
      stroke="#FFFFFF"
      stroke-width="2"
    />
    <!-- Soil Horizon Ridge Highlights -->
    <path
      d="M46,86 C54,82 66,82 74,86"
      stroke="#D97706"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- Center Living Sprout / Plant Seedling (Resilient Growth) -->
    <!-- Left Leaf -->
    <path
      d="M60,76 C52,72 44,60 48,50 C56,50 60,62 60,76 Z"
      fill="url(#leafGrad)"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Left Leaf Rib -->
    <path
      d="M52,60 C55,64 58,68 60,74"
      stroke="#A7F3D0"
      stroke-width="1"
      stroke-linecap="round"
    />

    <!-- Right Dominant Leaf -->
    <path
      d="M60,76 C62,60 68,46 78,48 C82,58 72,70 60,76 Z"
      fill="#10B981"
      stroke="#FFFFFF"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Right Leaf Rib -->
    <path
      d="M60,74 C66,68 70,60 74,54"
      stroke="#D1FAE5"
      stroke-width="1"
      stroke-linecap="round"
    />

    <!-- Emergent Stem -->
    <path
      d="M60,82 L60,68"
      stroke="#047857"
      stroke-width="2.5"
      stroke-linecap="round"
    />

    <!-- Glistening Dew Droplet (Moisture / Satellite Water Index Optimization) -->
    <ellipse cx="68" cy="46" rx="2.5" ry="3.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" transform="rotate(25 68 46)" />
    <circle cx="67" cy="44.5" r="0.8" fill="#FFFFFF" />

    <!-- Tiny Star / Observation Sparkle -->
    <path
      d="M32,32 L33,35 L36,36 L33,37 L32,40 L31,37 L28,36 L31,35 Z"
      fill="#F59E0B"
      stroke="#FFFFFF"
      stroke-width="0.8"
    />
  </g>
</svg>
